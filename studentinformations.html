<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Information System</title>
  <style>
    body {
      background-color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 350px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      background-color: #f0f8ff; /* light blue tint */
      border-radius: 8px;
      text-align: center;
    }
    h2 {
      color: blue;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: blue;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: darkblue;
    }
    #profilePreview, #dashPhoto {
      display: block;
      margin: 10px auto;
      border-radius: 50%;
      border: 2px solid blue;
    }
    .link {
      margin-top: 10px;
    }
    .link a {
      color: blue;
      text-decoration: none;
    }
    .dashboard-info {
      text-align: left;
      margin-top: 15px;
    }
    .dashboard-info p {
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <!-- Login Box -->
  <div class="container" id="loginBox">
    <h2>Login</h2>
    <form onsubmit="return loginUser(event)">
      <input type="text" id="loginName" placeholder="Name" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="link">
      <a href="#" onclick="showRegister()">Create Account</a>
    </div>
  </div>

  <!-- Register Box -->
  <div class="container" id="registerBox" style="display:none;">
    <h2>Register</h2>
    <form onsubmit="return registerUser(event)">
      <input type="text" id="regName" placeholder="Name" required>
      <input type="number" id="regAge" placeholder="Age" required>
      <input type="text" id="regCourse" placeholder="Course" required>
      <input type="date" id="regBirthdate" required>
      <input type="text" id="regAddress" placeholder="Address" required>
      <input type="file" id="regPhoto" accept="image/*" onchange="previewPhoto(event)">
      <img id="profilePreview" width="120" height="120" alt="Profile Preview">
      <input type="password" id="regPassword" placeholder="Password" required>
      <button type="submit">Register</button>
    </form>
    <div class="link">
      <a href="#" onclick="showLogin()">Back to Login</a>
    </div>
  </div>

  <!-- Dashboard -->
  <div class="container" id="dashboardBox" style="display:none;">
    <h2>Student Dashboard</h2>
    <img id="dashPhoto" width="120" height="120" alt="Profile Photo">
    <div class="dashboard-info">
      <p><strong>Name:</strong> <span id="dashName"></span></p>
      <p><strong>Age:</strong> <span id="dashAge"></span></p>
      <p><strong>Course:</strong> <span id="dashCourse"></span></p>
      <p><strong>Birthdate:</strong> <span id="dashBirthdate"></span></p>
      <p><strong>Address:</strong> <span id="dashAddress"></span></p>
    </div>
    <div class="link">
      <a href="#" onclick="logoutUser()">Logout</a>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('registerBox').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('registerBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }
    function previewPhoto(event) {
      const reader = new FileReader();
      reader.onload = function(){
        document.getElementById('profilePreview').src = reader.result;
      };
      reader.readAsDataURL(event.target.files[0]);
    }
    function registerUser(event) {
      event.preventDefault();
      const student = {
        name: document.getElementById('regName').value,
        age: document.getElementById('regAge').value,
        course: document.getElementById('regCourse').value,
        birthdate: document.getElementById('regBirthdate').value,
        address: document.getElementById('regAddress').value,
        password: document.getElementById('regPassword').value,
        photo: document.getElementById('profilePreview').src
      };
      localStorage.setItem('student', JSON.stringify(student));
      alert('Registration successful! Please login.');
      showLogin();
    }
    function loginUser(event) {
      event.preventDefault();
      const student = JSON.parse(localStorage.getItem('student'));
      const name = document.getElementById('loginName').value;
      const password = document.getElementById('loginPassword').value;
      if(student && student.name === name && student.password === password) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboardBox').style.display = 'block';
        document.getElementById('dashName').textContent = student.name;
        document.getElementById('dashAge').textContent = student.age;
        document.getElementById('dashCourse').textContent = student.course;
        document.getElementById('dashBirthdate').textContent = student.birthdate;
        document.getElementById('dashAddress').textContent = student.address;
        document.getElementById('dashPhoto').src = student.photo;
      } else {
        alert('Invalid login credentials!');
      }
    }
    function logoutUser() {
      document.getElementById('dashboardBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
    }
  </script>
</body>
</html>
